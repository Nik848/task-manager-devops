---
# ==============================================================================
# Playbook: deploy_application.yml
# Purpose: Deploys the Task Management System manifests to the Kubernetes cluster
#          in orderly stages: Namespace, Storage, RBAC, Config, Services, Ingress,
#          and Deployments. Waits for rollout and verifies pod/service health.
# ==============================================================================

- name: Deploy Task Management Application to Kubernetes
  hosts: local
  gather_facts: false

  vars_files:
    - "../group_vars/all.yml"

  vars:
    context_flag: "--context={{ k8s_context }}"
    manifests: "{{ playbook_dir }}/../../k8s"

  tasks:
    - name: 1. Verify cluster connectivity and current context
      ansible.builtin.command: >-
        kubectl {{ context_flag }} cluster-info
      register: cluster_info
      changed_when: false

    - name: Display target cluster information
      ansible.builtin.debug:
        msg: "{{ cluster_info.stdout_lines[0] | default('Connected to Kubernetes') }}"

    - name: 2. Ensure task-manager namespace exists
      ansible.builtin.command: >-
        kubectl {{ context_flag }} apply -f {{ manifests }}/namespace.yaml
      register: ns_out
      changed_when: "'configured' in ns_out.stdout or 'created' in ns_out.stdout"

    - name: 3. Apply Persistent Volume and Persistent Volume Claim
      ansible.builtin.command: >-
        kubectl {{ context_flag }} apply -f {{ item }}
      loop:
        - "{{ manifests }}/task-manager-pv.yaml"
        - "{{ manifests }}/task-manager-pvc.yaml"
      register: storage_out
      changed_when: "'configured' in storage_out.stdout or 'created' in storage_out.stdout"

    - name: 4. Apply Role-Based Access Control (RBAC) manifests
      ansible.builtin.command: >-
        kubectl {{ context_flag }} apply -f {{ manifests }}/rbac.yaml
      register: rbac_out
      changed_when: "'configured' in rbac_out.stdout or 'created' in rbac_out.stdout"

    - name: 4b. Detect whether ArgoCD Application task-manager-gitops manages GitOps config
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get application task-manager-gitops -n argocd --ignore-not-found -o jsonpath='{.metadata.name}'
      register: argocd_app_check
      changed_when: false
      failed_when: false

    - name: Set GitOps ownership fact
      ansible.builtin.set_fact:
        gitops_active: "{{ (argocd_app_check.stdout | default('') | trim) == 'task-manager-gitops' }}"

    - name: Inform operator when ArgoCD owns task-manager-config
      ansible.builtin.debug:
        msg: >-
          ArgoCD Application 'task-manager-gitops' is active in namespace 'argocd'.
          Skipping Ansible ConfigMap apply and legacy backend rollout restart; edit
          'gitops/manifests/configmap.yaml' on branch 'develop' for configuration changes.
      when: gitops_active

    - name: 5. Apply non-sensitive ConfigMap from Ansible single source of truth (non-GitOps only)
      ansible.builtin.shell: |
        cat <<EOF | kubectl {{ context_flag }} apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: task-manager-config
          namespace: {{ k8s_namespace }}
          labels:
            app.kubernetes.io/name: task-manager-config
            app.kubernetes.io/part-of: task-manager-system
            managed-by: ansible
        data:
          NODE_ENV: "{{ app_node_env }}"
          PORT: "{{ app_port }}"
          LOG_LEVEL: "{{ app_log_level }}"
          CORS_ORIGIN: "{{ app_cors_origin }}"
          ADMIN_NAME: "{{ app_admin_name }}"
        EOF
      register: cm_out
      changed_when: "'configured' in cm_out.stdout or 'created' in cm_out.stdout"
      when: not gitops_active

    - name: 6. Check if Backend deployment exists for rollout restart
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get deployment backend -n {{ k8s_namespace }} --ignore-not-found -o jsonpath='{.metadata.name}'
      register: backend_dep_check
      when:
        - not gitops_active
        - cm_out.changed | default(false)
      changed_when: false

    - name: 7. Restart Backend deployment after ConfigMap change
      ansible.builtin.command: >-
        kubectl {{ context_flag }} rollout restart deployment/backend -n {{ k8s_namespace }}
      when:
        - not gitops_active
        - cm_out.changed | default(false)
        - backend_dep_check.stdout is defined
        - backend_dep_check.stdout == 'backend'

    - name: 8. Wait for Backend rollout completion if restarted
      ansible.builtin.command: >-
        kubectl {{ context_flag }} rollout status deployment/backend -n {{ k8s_namespace }} --timeout=120s
      when:
        - not gitops_active
        - cm_out.changed | default(false)
        - backend_dep_check.stdout is defined
        - backend_dep_check.stdout == 'backend'

    - name: 9. Verify that required Kubernetes Secret exists
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get secret task-manager-secret -n {{ k8s_namespace }} --ignore-not-found -o jsonpath='{.metadata.name}'
      register: secret_check
      changed_when: false

    - name: 10. Fail if task-manager-secret does not exist
      ansible.builtin.fail:
        msg: >
          CRITICAL ERROR: Required Secret 'task-manager-secret' was not found in namespace '{{ k8s_namespace }}'.
          Placeholder credentials from k8s/secret.yaml are NEVER automatically applied.
          Please provision 'task-manager-secret' securely before deploying, e.g.:
            kubectl create secret generic task-manager-secret \
              --from-literal=DATABASE_URL='<YOUR_DATABASE_URL>' \
              --from-literal=JWT_SECRET='<YOUR_JWT_SECRET>' \
              -n {{ k8s_namespace }}
      when: secret_check.stdout == ''

    - name: 11a. Inspect existing backend-service Blue-Green selector
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get service backend-service -n {{ k8s_namespace }} --ignore-not-found -o jsonpath='{.spec.selector.version}'
      register: be_svc_ver
      changed_when: false

    - name: 11b. Inspect existing frontend-service Blue-Green selector
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get service frontend-service -n {{ k8s_namespace }} --ignore-not-found -o jsonpath='{.spec.selector.version}'
      register: fe_svc_ver
      changed_when: false

    - name: 11c. Preserve active Blue-Green selector on backend-service
      ansible.builtin.debug:
        msg: "Preserving active Blue-Green selector (version={{ be_svc_ver.stdout | trim }}) on backend-service."
      when: (be_svc_ver.stdout | default('') | trim) in ['blue', 'green']

    - name: 11d. Apply backend-service manifest only when no active Blue-Green selector is set
      ansible.builtin.command: >-
        kubectl {{ context_flag }} apply -f {{ manifests }}/backend-service.yaml
      register: be_svc_out
      changed_when: "'configured' in be_svc_out.stdout or 'created' in be_svc_out.stdout"
      when: (be_svc_ver.stdout | default('') | trim) not in ['blue', 'green']

    - name: 11e. Preserve active Blue-Green selector on frontend-service
      ansible.builtin.debug:
        msg: "Preserving active Blue-Green selector (version={{ fe_svc_ver.stdout | trim }}) on frontend-service."
      when: (fe_svc_ver.stdout | default('') | trim) in ['blue', 'green']

    - name: 11f. Apply frontend-service manifest only when no active Blue-Green selector is set
      ansible.builtin.command: >-
        kubectl {{ context_flag }} apply -f {{ manifests }}/frontend-service.yaml
      register: fe_svc_out
      changed_when: "'configured' in fe_svc_out.stdout or 'created' in fe_svc_out.stdout"
      when: (fe_svc_ver.stdout | default('') | trim) not in ['blue', 'green']

    - name: 12. Apply Ingress manifest
      ansible.builtin.command: >-
        kubectl {{ context_flag }} apply -f {{ manifests }}/ingress.yaml
      register: ingress_out
      changed_when: "'configured' in ingress_out.stdout or 'created' in ingress_out.stdout"

    - name: 13. Apply Backend and Frontend Deployments
      ansible.builtin.command: >-
        kubectl {{ context_flag }} apply -f {{ item }}
      loop:
        - "{{ manifests }}/backend-deployment.yaml"
        - "{{ manifests }}/frontend-deployment.yaml"
      register: dep_out
      changed_when: "'configured' in dep_out.stdout or 'created' in dep_out.stdout"

    - name: 14. Wait for Backend deployment rollout to complete
      ansible.builtin.command: >-
        kubectl {{ context_flag }} rollout status deployment/backend -n {{ k8s_namespace }} --timeout=120s
      changed_when: false

    - name: 15. Wait for Frontend deployment rollout to complete
      ansible.builtin.command: >-
        kubectl {{ context_flag }} rollout status deployment/frontend -n {{ k8s_namespace }} --timeout=120s
      changed_when: false

    - name: 16. Query and display running pods
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get pods -n {{ k8s_namespace }} -o wide
      register: pods_status
      changed_when: false

    - name: 17. Query and display active services
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get svc -n {{ k8s_namespace }}
      register: svc_status
      changed_when: false

    - name: Application Deployment Summary
      ansible.builtin.debug:
        msg:
          - "GitOps Active (ArgoCD): {{ gitops_active }}"
          - "Pods Status:"
          - "{{ pods_status.stdout_lines }}"
          - "Services Status:"
          - "{{ svc_status.stdout_lines }}"
          - "ConfigMap Rollout Triggered: {{ (not gitops_active) and (cm_out.changed | default(false)) }}"
