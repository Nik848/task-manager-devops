---
# ==============================================================================
# Playbook: configure_application.yml
# Purpose: Manages non-sensitive application configuration in Kubernetes ConfigMaps
#          using Ansible variables as the single source of truth.
#          Safely updates task-manager-config and triggers a controlled backend
#          rollout ONLY when the configuration has changed.
# ==============================================================================

- name: Manage Application Configuration via Kubernetes ConfigMap
  hosts: local
  gather_facts: false

  vars_files:
    - "../group_vars/all.yml"

  vars:
    context_flag: "--context={{ k8s_context }}"

  tasks:
    - name: 1. Verify target cluster connectivity
      ansible.builtin.command: >-
        kubectl {{ context_flag }} cluster-info
      register: cluster_check
      changed_when: false

    - name: 2. Ensure target namespace exists
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get namespace {{ k8s_namespace }}
      changed_when: false

    - name: 3. Apply non-sensitive ConfigMap from Ansible single source of truth
      ansible.builtin.shell: |
        cat <<EOF | kubectl {{ context_flag }} apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: task-manager-config
          namespace: {{ k8s_namespace }}
          labels:
            app.kubernetes.io/name: task-manager-config
            app.kubernetes.io/part-of: task-manager-system
            managed-by: ansible
        data:
          NODE_ENV: "{{ app_node_env }}"
          PORT: "{{ app_port }}"
          LOG_LEVEL: "{{ app_log_level }}"
          CORS_ORIGIN: "{{ app_cors_origin }}"
          ADMIN_NAME: "{{ app_admin_name }}"
        EOF
      register: cm_apply_output
      changed_when: "'configured' in cm_apply_output.stdout or 'created' in cm_apply_output.stdout"

    - name: 4. Trigger controlled backend rollout ONLY when ConfigMap changed
      ansible.builtin.command: >-
        kubectl {{ context_flag }} rollout restart deployment/backend -n {{ k8s_namespace }}
      when: cm_apply_output.changed
      register: backend_restart_out

    - name: 5. Wait for backend rollout completion if configuration changed
      ansible.builtin.command: >-
        kubectl {{ context_flag }} rollout status deployment/backend -n {{ k8s_namespace }} --timeout=120s
      when: cm_apply_output.changed

    - name: 6. Verify backend deployment availability
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get deployment backend -n {{ k8s_namespace }}
      register: backend_avail
      changed_when: false

    - name: 7. Verify task-manager-config ConfigMap exists and inspect contents
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get configmap task-manager-config -n {{ k8s_namespace }} -o yaml
      register: cm_verify
      changed_when: false

    - name: 8. Verify sensitive Secret task-manager-secret exists (never printing secret data)
      ansible.builtin.command: >-
        kubectl {{ context_flag }} get secret task-manager-secret -n {{ k8s_namespace }} --ignore-not-found -o jsonpath='{.metadata.name}'
      register: secret_verify
      changed_when: false

    - name: Fail if task-manager-secret is missing
      ansible.builtin.fail:
        msg: "CRITICAL: Required Secret 'task-manager-secret' is missing in namespace '{{ k8s_namespace }}'."
      when: secret_verify.stdout == ''

    - name: Display Configuration Management Verification Summary
      ansible.builtin.debug:
        msg:
          - "ConfigMap Status: {{ cm_apply_output.stdout | trim }}"
          - "Rollout Triggered: {{ cm_apply_output.changed }}"
          - "Secret Preserved: {{ (secret_verify.stdout != '') | ternary('task-manager-secret (present and untouched)', 'missing') }}"
          - "Configured CORS Origins: {{ app_cors_origin }}"
          - "Configured Environment: {{ app_node_env }}"
