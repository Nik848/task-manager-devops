# Local controller / orchestrator (executes Kubernetes & deployment playbooks)
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Conventional Ubuntu Linux target hosts for Docker Engine provisioning
[docker_nodes]
# node1.example.com ansible_host=192.168.1.50 ansible_user=ubuntu

# Conventional Ubuntu Linux target hosts for Kubernetes cluster (kubeadm) provisioning
[k8s_control_plane]
# k8s-master.example.com ansible_host=192.168.1.60 ansible_user=ubuntu is_control_plane=true

[k8s_workers]
# k8s-worker1.example.com ansible_host=192.168.1.61 ansible_user=ubuntu is_worker=true
# k8s-worker2.example.com ansible_host=192.168.1.62 ansible_user=ubuntu is_worker=true

[k8s_nodes:children]
k8s_control_plane
k8s_workers
