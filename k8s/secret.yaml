apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secret
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager-secret
    app.kubernetes.io/part-of: task-manager-system
type: Opaque
stringData:
  # NOTE: In production or git repository, keep placeholders.
  # Replace these with your actual Supabase PostgreSQL connection string and secret:
  DATABASE_URL: "postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres"
  JWT_SECRET: "replace-with-a-secure-random-jwt-secret-key"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "changeme123"
