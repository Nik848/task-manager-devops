apiVersion: v1
kind: ConfigMap
metadata:
  name: task-manager-config
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager-config
    app.kubernetes.io/part-of: task-manager-system
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "http://localhost,http://localhost:80,http://localhost:8080,http://task-manager.local,*"
  ADMIN_NAME: "Admin"
