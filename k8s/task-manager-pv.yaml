apiVersion: v1
kind: PersistentVolume
metadata:
  name: task-manager-pv
  labels:
    type: local
    app.kubernetes.io/name: task-manager-pv
    app.kubernetes.io/part-of: task-manager-system
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/run/desktop/mnt/host/c/k8s-taskmanager-data"
