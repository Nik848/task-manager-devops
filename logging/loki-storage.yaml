apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-pv
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: task-manager-system
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/loki-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: task-manager-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 2Gi
  volumeName: loki-pv
