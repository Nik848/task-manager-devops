apiVersion: v1
data:
  task-manager-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Application Health & Availability",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "text": "DOWN" }, "1": { "color": "green", "text": "UP" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "up{job=\"task-manager-backend\"}",
              "legendFormat": "Scrape Target: {{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Backend Metrics Endpoint Scrape Status",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "text": "NOT READY" }, "1": { "color": "green", "text": "READY" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "id": 8,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "kube_pod_status_ready{namespace=\"task-manager\", condition=\"true\"}",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Application Pod Readiness (kube-state-metrics)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisColorMode": "text", "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2 },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "options": {
            "legend": { "calcs": ["mean", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(http_requests_total{job=\"task-manager-backend\"}[1m])) by (method, route, status_code)",
              "legendFormat": "{{method}} {{route}} ({{status_code}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Backend HTTP Request Rate",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 101,
          "title": "Application Performance & Latency",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisColorMode": "text", "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 7 },
          "id": 3,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(http_request_duration_seconds_sum{job=\"task-manager-backend\"}[1m])) / sum(rate(http_request_duration_seconds_count{job=\"task-manager-backend\"}[1m]))",
              "legendFormat": "Average Latency",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"task-manager-backend\"}[1m])) by (le))",
              "legendFormat": "p95 Latency",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "HTTP Request Latency (Average & p95)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisColorMode": "text", "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2 },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 7 },
          "id": 4,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "rate(process_cpu_seconds_total{job=\"task-manager-backend\"}[1m]) * 100",
              "legendFormat": "{{instance}} (Node.js Process CPU)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Backend Process CPU Usage",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 102,
          "title": "Resource Utilization (Cluster & Containers)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisColorMode": "text", "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2 },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 15 },
          "id": 5,
          "options": {
            "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "process_resident_memory_bytes{job=\"task-manager-backend\"}",
              "legendFormat": "Resident Memory (RSS)",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "nodejs_heap_size_used_bytes{job=\"task-manager-backend\"}",
              "legendFormat": "Heap Used",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "nodejs_heap_size_total_bytes{job=\"task-manager-backend\"}",
              "legendFormat": "Heap Total",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Backend Process Memory Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisColorMode": "text", "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2 },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 15 },
          "id": 6,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"task-manager\", container=~\"backend|frontend\"}[1m])) by (pod, container) * 100",
              "legendFormat": "{{pod}} ({{container}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Pod CPU Usage (cAdvisor)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisColorMode": "text", "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2 },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 15 },
          "id": 7,
          "options": {
            "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"task-manager\", container=~\"backend|frontend\"}) by (pod, container)",
              "legendFormat": "{{pod}} ({{container}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Pod Memory Usage (cAdvisor)",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": ["task-manager", "devops", "kubernetes"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"] },
      "timezone": "browser",
      "title": "Task Management System — Operations Overview",
      "uid": "task-manager-overview",
      "version": 2
    }
kind: ConfigMap
metadata:
  name: grafana-dashboard-task-manager
  namespace: monitoring
