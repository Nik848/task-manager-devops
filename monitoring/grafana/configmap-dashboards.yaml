apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: task-manager-system
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: "Task Management System"
        orgId: 1
        folder: "Task Manager"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
