version: "3.8"

services:
  backend:
    build: ./app/backend
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./app/backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
