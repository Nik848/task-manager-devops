apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse existing Kubernetes manifests without duplicating definitions.
# Excluded intentionally:
#   - ../k8s/secret.yaml (managed securely outside GitOps)
#   - ../k8s/task-manager-pv.yaml & task-manager-pvc.yaml (protected from automated pruning)
#   - ../k8s/backend-deployment.yaml & frontend-deployment.yaml (legacy pre-Blue-Green manifests)
resources:
  - ../k8s/configmap.yaml
  - ../k8s/rbac.yaml
  - ../k8s/ingress.yaml
  - ../k8s/backend-service.yaml
  - ../k8s/frontend-service.yaml
  - ../k8s/blue-green/backend-blue.yaml
  - ../k8s/blue-green/frontend-blue.yaml
  - ../k8s/blue-green/backend-green.yaml
  - ../k8s/blue-green/frontend-green.yaml
