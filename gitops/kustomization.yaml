apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# GitOps-managed application manifests (reusing k8s/ definitions).
# Excluded intentionally:
#   - secret.yaml (managed securely outside GitOps)
#   - task-manager-pv.yaml & task-manager-pvc.yaml (protected from automated pruning)
#   - legacy backend-deployment.yaml & frontend-deployment.yaml
resources:
  - manifests/configmap.yaml
  - manifests/rbac.yaml
  - manifests/ingress.yaml
  - manifests/backend-service.yaml
  - manifests/frontend-service.yaml
  - manifests/backend-blue.yaml
  - manifests/frontend-blue.yaml
  - manifests/backend-green.yaml
  - manifests/frontend-green.yaml
