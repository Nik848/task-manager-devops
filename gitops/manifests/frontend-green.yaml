apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: task-manager
  labels:
    app: frontend
    version: green
    app.kubernetes.io/name: frontend-green
    app.kubernetes.io/part-of: task-manager-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
      version: green
  template:
    metadata:
      labels:
        app: frontend
        version: green
        app.kubernetes.io/name: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: taskmanager-frontend:v2.0.0-green
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
      restartPolicy: Always
